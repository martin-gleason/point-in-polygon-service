[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "point-in-polygon-service"
version = "0.1.0"
description = "FOSS point-in-polygon web service: given an address or point, which polygon of a layer contains it? First dataset: Chicago / Cook County police districts."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "geopandas>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# XLSX support for batch runs (F7). Kept optional so the base install stays as
# lean as it is today: CSV and published Google Sheets need nothing beyond the
# core dependencies, and a locked-down box that cannot pip-install extras can
# still run batches from CSV.
batch = [
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "openpyxl>=3.1",
]

[tool.setuptools]
packages = ["app", "app.geocoding", "app.batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
